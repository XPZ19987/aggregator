name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        run: |
          # 最终修正版：直接调用环境变量，去掉冗余参数
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -o \
            -g "d1eae861da1ff1fb632e4fa08e2f06b3" \
            -k "${{ secrets.GIST_PAT }}"
