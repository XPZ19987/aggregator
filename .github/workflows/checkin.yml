name: Update Aggregator Subscriptions

on:
  workflow_dispatch: # 支持手动运行
  schedule:
    - cron: '0 0,12 * * *' # 每天北京时间 8:00 和 20:00 自动运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        run: |
          # 核心修正：使用 -g (Gist ID) 和 -k (Token) 触发上传
          # 使用 -o clash.yaml 固定生成的文件名
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -o clash.yaml \
            -g "${{ secrets.GIST_ID }}" \
            -k "${{ secrets.GIST_PAT }}"
