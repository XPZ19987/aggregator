name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Nodes Only
        # 这里的 -o 参数告诉脚本：只生成文件，不要上传！(绕过 404 Bug)
        run: |
          python subscribe/collect.py -t clash -n 300 -o

      - name: Upload to Gist (Manual Mode)
        env:
          # 读取你的 Token
          TOKEN: ${{ secrets.GIST_PAT }}
          # 我已经帮你填好了你截图里那个正确的 Gist ID
          GIST_ID: "c281adea33043e62dbfd1384485b6bc9"
        run: |
          # 1. 设置账号身份
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 2. 拉取你的 Gist 仓库 (使用 Token 认证)
          git clone https://x-access-token:$TOKEN@gist.github.com/$GIST_ID.git gist_repo
          
          # 3. 把生成的节点文件复制进去
          # 注意：脚本生成的文件在 data/clash.yaml
          cp data/clash.yaml gist_repo/clash.yaml
          
          # 4. 提交并推送
          cd gist_repo
          git add clash.yaml
          git commit -m "Auto update by Github Actions" || echo "没有新节点，跳过更新"
          git push
