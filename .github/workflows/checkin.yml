name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        env:
          MY_GIST_ID: ${{ secrets.GIST_ID }}
          MY_GIST_PAT: ${{ secrets.secrets.GIST_PAT }}
        run: |
          # 使用修正后的变量引用和参数
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -g "${{ secrets.GIST_ID }}" \
            -k "${{ secrets.GIST_PAT }}" \
            -o clash.yaml
