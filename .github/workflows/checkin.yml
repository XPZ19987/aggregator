name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          # 确认：使用 subscribe/collect.py 而不是 main.py
          python subscribe/collect.py \
            --include "SG|JP|US|新加坡|日本|美国" \
            --exclude "过期|流量|官网|网站|群|注册" \
            --max-num 300 \
            --out clash.yaml \
            --upload-gist true
