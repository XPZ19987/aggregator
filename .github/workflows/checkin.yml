name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        env:
          # 使用环境变量传递，这是最稳的方式
          PAT: ${{ secrets.GIST_PAT }}
          GID: "d1eae861da1ff1fb632e4fa08e2f06b3"
        run: |
          # 1. 自检：检查 Token 是否读取成功
          if [ -z "$PAT" ]; then
            echo "❌ 错误: GIST_PAT 是空的！请检查 Secrets 设置。"
            exit 1
          else
            echo "✅ 成功: GIST_PAT 已读取 (长度: ${#PAT})"
          fi

          # 2. 运行脚本 (注意：这里绝对没有 -o 参数)
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -g "$GID" \
            -k "$PAT"
