name: Update Aggregator Subscriptions

on:
  workflow_dispatch: # 支持手动运行
  schedule:
    - cron: '0 0,12 * * *' # 每天北京时间 8点和20点自动运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          # 修正后的命令：使用 collect.py 且只使用它支持的参数
          # -t: 格式(clash)
          # -n: 数量(300)
          # -g: Gist ID
          # -k: GitHub Token
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -g ${{ secrets.GIST_ID }} \
            -k ${{ secrets.GIST_PAT }}
