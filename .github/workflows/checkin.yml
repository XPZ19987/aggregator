name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        run: |
          # 核心修正：
          # 1. 恢复使用 secrets (因为 Token 是有效的，GitHub 已经证实了)
          # 2. 彻底删除了 -o 参数 (它是导致只生成不上传的罪魁祸首)
          
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -g "d1eae861da1ff1fb632e4fa08e2f06b3" \
            -k "${{ secrets.GIST_PAT }}"
