name: Update Aggregator Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Aggregator
        env:
          # 只保留 PAT 变量，因为它是秘密
          PAT: ${{ secrets.GIST_PAT }}
        run: |
          # 1. 自检: 确保密码已读取
          if [ -z "$PAT" ]; then
            echo "❌ 错误: GIST_PAT 没读到！"
            exit 1
          else
            echo "✅ 成功: GIST_PAT 已读取"
          fi

          # 2. 运行脚本 
          # 重点修正：直接把链接粘贴在这里，不使用变量，防止任何格式错误！
          python subscribe/collect.py \
            -t clash \
            -n 300 \
            -g "https://gist.github.com/XPZ19987/d1eae861da1ff1fb632e4fa08e2f06b3" \
            -k "$PAT"
